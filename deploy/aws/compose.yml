name: resolve
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated database password}
      POSTGRES_DB: tickets_db
    volumes:
      - /opt/resolve/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ticket_admin -d tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: ${APP_ENV_FILE:-/opt/resolve/.env}
    environment:
      ENV: production
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DATABASE_URL: postgresql://ticket_admin:${POSTGRES_PASSWORD}@postgres:5432/tickets_db
      GOOGLE_APPLICATION_CREDENTIALS: /srv/gcp-key.json
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - /opt/resolve/secrets/gcp-key.json:/srv/gcp-key.json:ro
      - /opt/resolve/data/models:/root/.cache/huggingface
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: /backend
        NEXT_PUBLIC_GRAFANA_URL: /grafana
    environment:
      API_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    depends_on: [backend]
    restart: unless-stopped
  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SERVER_ROOT_URL: https://${APP_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a generated Grafana password}
      GF_INSTALL_PLUGINS: grafana-bigquery-datasource 2.2.1
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Read-only dashboard viewing is inside the Caddy password boundary.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      BIGQUERY_PROJECT_ID: ${GCP_PROJECT_ID}
      BIGQUERY_CLIENT_EMAIL: ${BIGQUERY_CLIENT_EMAIL}
      BIGQUERY_PRIVATE_KEY: ${BIGQUERY_PRIVATE_KEY}
    volumes:
      - /opt/resolve/data/grafana:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:?Set the hostname printed by Terraform or your own DNS name}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Set the bcrypt hash generated by package.py}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/resolve/data/caddy:/data
    depends_on: [frontend, grafana]
    restart: unless-stopped
