name: CI

# Lint → tests → eval gate → Docker build (each needs the previous).
# Lint/test mock external services (tests/conftest.py). Eval-gate installs
# Ollama and runs real intent/priority F1; RAG eval is --skip-rag (needs
# seeded Pinecone).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.3.4
      - name: Run ruff
        run: ruff check .

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          # Dummy values so app/config.py validates; tests mock network calls.
          DATABASE_URL: sqlite:///./ci_test.db
          AZURE_TEXT_ANALYTICS_ENDPOINT: https://example.cognitiveservices.azure.com/
          AZURE_TEXT_ANALYTICS_KEY: ci-placeholder-key
          PINECONE_API_KEY: ci-placeholder-key
          PINECONE_ENVIRONMENT: us-east-1
          OLLAMA_BASE_URL: http://localhost:11434
          DOMAIN_PACK: it_saas
          ENABLE_BIGQUERY: "false"

  eval-gate:
    name: Evaluation gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
      - name: Pull judge/agent model
        run: ollama pull qwen2.5:3b
      - name: Run evaluation harness against baseline
        # Real Ollama F1 for it_saas; healthcare intent reported N/A; RAG skipped.
        run: python eval/run_eval.py --pack all --skip-rag --max-examples 20
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          DATABASE_URL: sqlite:///./ci_eval.db
          AZURE_TEXT_ANALYTICS_ENDPOINT: https://example.cognitiveservices.azure.com/
          AZURE_TEXT_ANALYTICS_KEY: ci-placeholder-key
          PINECONE_API_KEY: ci-placeholder-key
          PINECONE_ENVIRONMENT: us-east-1
          DOMAIN_PACK: it_saas
          ENABLE_BIGQUERY: "false"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.json
          if-no-files-found: ignore

  build:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: eval-gate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ticket-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ticket-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_GRAFANA_URL=http://localhost:3001
