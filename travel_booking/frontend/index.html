<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Travel Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb; --border-soft: #eef0f3;
    --text: #111827; --muted: #6b7280; --muted-soft: #9ca3af;
    --brand: #1967d2; --brand-soft: #e8f0fe; --brand-dark: #1552ab;
    --pass: #16a34a; --pass-soft: #ecfdf3;
    --fail: #dc2626; --fail-soft: #fef2f2;
    --radius: 14px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 90px; }

  header.hero { margin-bottom: 24px; }
  header.hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
  header.hero .sub { color: var(--muted); font-size: 14.5px; margin: 0; line-height: 1.4; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(17,24,39,0.04); }

  /* -- chat -- */
  .chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .row-user { display: flex; justify-content: flex-end; }
  .bubble-user { background: var(--brand); color: white; padding: 10px 15px; border-radius: 16px 16px 4px 16px; max-width: 78%; font-size: 14.5px; line-height: 1.45; }
  .row-agent { display: flex; justify-content: flex-start; }
  .bubble-agent { background: #f1f3f5; color: var(--text); padding: 10px 15px; border-radius: 4px 16px 16px 16px; max-width: 82%; font-size: 14.5px; line-height: 1.45; }
  .bubble-agent.question { background: var(--brand-soft); }
  .bubble-confirm { background: var(--pass-soft); border: 1px solid rgba(22,163,74,0.25); border-radius: 12px; padding: 10px 15px; max-width: 88%; font-size: 13.5px; line-height: 1.5; display: flex; gap: 9px; align-items: flex-start; }
  .bubble-confirm .stamp { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--pass); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }

  .row-searching { display: flex; justify-content: flex-start; }
  .searching-pill { display: flex; align-items: center; gap: 9px; background: #f1f3f5; color: var(--muted); padding: 9px 15px; border-radius: 16px; font-size: 13px; }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: bounce 1.1s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

  .chat-input-row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14.5px; font-family: 'Inter', sans-serif; background: var(--surface); }
  input[type=text]:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  button { padding: 12px 20px; border-radius: 10px; border: none; background: var(--brand); color: white; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  button:hover:not(:disabled) { background: var(--brand-dark); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .hidden { display: none; }

  /* -- itinerary pair -- */
  .pair-label { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
  .itinerary { display: flex; gap: 14px; }
  .itin-item { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 3px rgba(17,24,39,0.04); }
  .itin-item img { width: 100%; height: 140px; object-fit: cover; display: block; }
  .itin-body { padding: 14px 16px; }
  .itin-kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--brand); margin-bottom: 8px; }
  .itin-item h3 { font-size: 15.5px; font-weight: 700; margin: 0 0 4px; }
  .itin-item p { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .itin-item .price-line { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 8px; }

  /* -- verification -- */
  .verify-card { margin-top: 6px; }
  .verify-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.02em; }
  .banner { padding: 16px 18px; border-radius: var(--radius-sm); margin-bottom: 18px; font-weight: 700; font-size: 16.5px; line-height: 1.4; display: flex; gap: 12px; align-items: flex-start; }
  .banner.verified { background: var(--pass-soft); color: #0f7a3a; }
  .banner.unsatisfiable { background: var(--fail-soft); color: #b91c1c; }
  .banner .badge { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; }
  .banner.verified .badge { background: var(--pass); }
  .banner.unsatisfiable .badge { background: var(--fail); }

  .check-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  .check-row:last-child { border-bottom: none; }
  .check-icon { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
  .check-icon.pass { background: var(--pass-soft); color: var(--pass); }
  .check-icon.fail { background: var(--fail-soft); color: var(--fail); }
  .check-body { flex: 1; min-width: 0; }
  .check-label { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .check-compare { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .check-compare .actual { padding: 1px 6px; border-radius: 5px; }
  .check-compare .actual.pass { background: var(--pass-soft); color: var(--pass); }
  .check-compare .actual.fail { background: var(--fail-soft); color: var(--fail); }
  .check-compare .vs { color: var(--muted-soft); font-weight: 500; margin: 0 6px; }
  .check-compare .limit { color: var(--muted); font-weight: 500; }
  .check-detail { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

  .total-cost { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
  .total-cost .lbl { font-size: 14px; color: var(--muted); }
  .total-cost .amt { font-size: 19px; font-weight: 800; }
  .assumptions { font-size: 12.5px; color: var(--muted-soft); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>Travel Desk</h1>
    <p class="sub">Tell it what you're looking for. It checks that the flight and hotel actually work together before calling anything verified.</p>
  </header>

  <div class="card" id="chat-card">
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="e.g. Family of 4 to Austin, need a pool, budget $2000 total, 3 nights" />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <div id="results-wrap" class="hidden"></div>
</div>

<script>
const chatLog = document.getElementById("chat-log");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
const resultsWrap = document.getElementById("results-wrap");

let conversationId = null;
let searched = false;
let shownTurnCount = 0;
let searchingEl = null;

function isConfirm(text) { return text.startsWith("Got it"); }
function isQuestion(text) { return text.trim().endsWith("?"); }

function renderTurn(t) {
  const row = document.createElement("div");
  if (t.role === "user") {
    row.className = "row-user";
    row.innerHTML = `<div class="bubble-user"></div>`;
    row.querySelector(".bubble-user").textContent = t.text;
  } else if (isConfirm(t.text)) {
    row.className = "row-agent";
    row.innerHTML = `<div class="bubble-confirm"><div class="stamp">&#10003;</div><div></div></div>`;
    row.querySelector(".bubble-confirm > div:last-child").textContent = t.text;
  } else {
    row.className = "row-agent";
    row.innerHTML = `<div class="bubble-agent ${isQuestion(t.text) ? 'question' : ''}"></div>`;
    row.querySelector(".bubble-agent").textContent = t.text;
  }
  chatLog.appendChild(row);
}

function showSearching() {
  const row = document.createElement("div");
  row.className = "row-searching";
  row.innerHTML = `<div class="searching-pill">
    <div class="dots"><span></span><span></span><span></span></div>
    Checking flight + hotel combinations…
  </div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  searchingEl = row;
}

function renderState(data) {
  for (let i = shownTurnCount; i < data.turns.length; i++) renderTurn(data.turns[i]);
  shownTurnCount = data.turns.length;
  chatLog.scrollTop = chatLog.scrollHeight;

  if ((data.status === "ready" || data.status === "best_effort") && !searched) {
    searched = true;
    chatInput.disabled = true;
    chatSend.disabled = true;
    showSearching();
    runSearch();
  }
}

async function runSearch() {
  const res = await fetch(`/api/search/${conversationId}`, { method: "POST" });
  const data = await res.json();
  if (searchingEl) searchingEl.remove();
  renderResults(data);
}

function checkRow(c) {
  const cls = c.passed ? 'pass' : 'fail';
  return `<div class="check-row">
    <div class="check-icon ${cls}">${c.passed ? '✓' : '✕'}</div>
    <div class="check-body">
      <div class="check-label">${c.label}</div>
      <div class="check-compare"><span class="actual ${cls}">${c.actual}</span><span class="vs">vs</span><span class="limit">${c.expected}</span></div>
      <div class="check-detail">${c.detail}</div>
    </div>
  </div>`;
}

function renderResults(data) {
  resultsWrap.classList.remove("hidden");
  const exp = data.explanation;
  let html = "";

  if (data.hotel || data.flight) {
    html += `<div class="pair-label">Proposed itinerary</div><div class="itinerary">`;
    if (data.hotel) {
      html += `<div class="itin-item">
        <img src="/images/hotels/${data.hotel.id}.jpg" alt="${data.hotel.name}" />
        <div class="itin-body">
          <div class="itin-kind">🏨 Hotel</div>
          <h3>${data.hotel.name}</h3>
          <p>${data.hotel.destination_name}</p>
          <p>${data.hotel.front_desk_24hr ? '24-hour front desk' : 'Desk closes ' + data.hotel.front_desk_closes}</p>
          <div class="price-line">$${data.hotel.price_per_night}/night${data.hotel.resort_fee_per_night ? ' + $' + data.hotel.resort_fee_per_night + ' fee' : ''}</div>
        </div>
      </div>`;
    }
    if (data.flight) {
      html += `<div class="itin-item">
        <img src="/images/flights/${data.flight.id}.jpg" alt="${data.flight.flight_number}" />
        <div class="itin-body">
          <div class="itin-kind">✈️ Flight</div>
          <h3>${data.flight.airline} ${data.flight.flight_number}</h3>
          <p>${data.flight.origin} → ${data.flight.destination}, ${data.flight.date}</p>
          <p>${data.flight.departure_time} → ${data.flight.arrival_time}${data.flight.arrives_next_day ? ' (+1 day)' : ''}</p>
          <div class="price-line">$${data.flight.price}/passenger</div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div class="card verify-card">
    <div class="verify-title">Verification</div>
    <div class="banner ${exp.status}"><div class="badge">${exp.status === 'verified' ? '✓' : '!'}</div><div>${exp.headline}</div></div>`;
  if (exp.checklist.length) {
    html += exp.checklist.map(checkRow).join("");
  }
  if (exp.total_cost) {
    html += `<div class="total-cost"><span class="lbl">Total trip cost</span><span class="amt">$${exp.total_cost.toFixed(2)}</span></div>`;
  }
  html += `</div>`;

  if (data.constraints.assumptions && data.constraints.assumptions.length) {
    html += `<div class="assumptions">Assumed: ${data.constraints.assumptions.join("; ")}.</div>`;
  }
  resultsWrap.innerHTML = html;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = "";
  chatSend.disabled = true;

  let res, data;
  if (!conversationId) {
    res = await fetch("/api/chat/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    data = await res.json();
    conversationId = data.conversation_id;
  } else {
    res = await fetch("/api/chat/reply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });
    data = await res.json();
  }
  chatSend.disabled = false;
  renderState(data);
}

chatSend.addEventListener("click", sendMessage);
chatInput.addEventListener("keydown", e => { if (e.key === "Enter" || e.keyCode === 13) sendMessage(); });
</script>
</body>
</html>
