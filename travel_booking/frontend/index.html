<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Travel Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ec; --paper-line: #e3dac3; --paper-line-soft: #ece4d3;
    --ink: #23262e; --ink-soft: #55524a; --ink-faint: #8b8676;
    --board: #1a1922; --board-line: #34323d; --board-text: #e8e4d8; --board-text-soft: #a29d8f;
    --amber: #f0a63c; --amber-soft: rgba(240,166,60,0.16); --amber-glow: rgba(240,166,60,0.35);
    --transit: #3d6ea6; --transit-soft: #e7eef6;
    --lodging: #b85a32; --lodging-soft: #f5e9e1;
    --pass: #2f8f5f; --pass-soft: #e5f3ec;
    --fail: #c1423a; --fail-soft: #fbeae8; --fail-glow: rgba(193,66,58,0.35);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, var(--paper-line-soft) 40px);
  }
  .mono { font-family: 'Space Mono', monospace; }
  .display { font-family: 'Archivo', sans-serif; font-weight: 800; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 20px 100px; }

  header.hero { margin-bottom: 28px; }
  header.hero .eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  header.hero h1 { font-size: 26px; margin: 4px 0 6px; letter-spacing: -0.01em; }
  header.hero .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .perf {
    height: 10px; margin: 20px 0;
    background-image: radial-gradient(circle, var(--paper) 3px, transparent 3.5px);
    background-size: 16px 10px; background-position: center;
    border-top: 1px dashed var(--paper-line); border-bottom: 1px dashed var(--paper-line);
  }

  .card { background: #fffdf8; border: 1px solid var(--paper-line); border-radius: var(--radius); padding: 18px; margin-bottom: 22px; box-shadow: 0 1px 2px rgba(35,38,46,0.04); }

  /* -- chat -- */
  .chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .row-user { display: flex; justify-content: flex-end; }
  .bubble-user {
    background: var(--ink); color: #fbf8f1; padding: 10px 14px; border-radius: 14px 14px 3px 14px;
    max-width: 78%; font-size: 14px; line-height: 1.4;
  }
  .row-agent { display: flex; justify-content: flex-start; }

  .bubble-question {
    max-width: 82%; background: var(--paper); border: 1px solid var(--paper-line); border-left: 3px solid var(--amber);
    border-radius: 3px 12px 12px 12px; padding: 10px 14px; font-size: 14px; line-height: 1.4; display: flex; gap: 8px; align-items: flex-start;
  }
  .bubble-question .tag {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--amber-soft); color: #9a6414;
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }

  .stub-confirm {
    max-width: 90%; background: #fffdf8; border: 1px solid var(--pass); border-radius: 6px;
    padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start;
    position: relative; overflow: hidden;
  }
  .stub-confirm::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pass); }
  .stub-confirm .stamp {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--pass-soft); color: var(--pass);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 1px;
  }
  .stub-confirm .stub-text { font-family: 'Space Mono', monospace; font-size: 12.5px; line-height: 1.5; color: var(--ink); }

  .row-searching { display: flex; justify-content: flex-start; }
  .searching-pill {
    display: flex; align-items: center; gap: 10px; background: var(--board); color: var(--board-text);
    padding: 9px 14px; border-radius: 20px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em;
  }
  .flap-dots { display: flex; gap: 4px; }
  .flap-dots span { width: 6px; height: 6px; border-radius: 1px; background: var(--amber); animation: flap 1.1s infinite ease-in-out; }
  .flap-dots span:nth-child(2) { animation-delay: 0.15s; }
  .flap-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes flap { 0%,100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

  .chat-input-row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--paper-line); font-size: 14px;
    font-family: 'Inter', sans-serif; background: #fffdf8;
  }
  input[type=text]:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  button {
    padding: 11px 18px; border-radius: 8px; border: none; background: var(--ink); color: #fbf8f1;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  button:hover:not(:disabled) { background: #34384a; }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .hidden { display: none; }

  /* -- itinerary pair -- */
  .pair-frame { position: relative; margin-bottom: 26px; }
  .pair-label {
    text-align: center; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 10px;
  }
  .itinerary { display: flex; gap: 0; align-items: stretch; }
  .itin-item {
    flex: 1; min-width: 0; background: #fffdf8; border: 1px solid var(--paper-line); padding: 16px; position: relative;
  }
  .itin-item.lodging { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
  .itin-item.transit { border-radius: 0 var(--radius) var(--radius) 0; }
  .itin-kind {
    display: inline-flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 10.5px;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; margin-bottom: 10px;
  }
  .itin-kind.lodging { background: var(--lodging-soft); color: var(--lodging); }
  .itin-kind.transit { background: var(--transit-soft); color: var(--transit); }
  .itin-item img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; display: block; }
  .itin-item h3 { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px; margin: 0 0 4px; }
  .itin-item p { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0; }
  .itin-item .mono-line { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink); margin-top: 6px; }
  .pair-link {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--amber);
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    border: 3px solid var(--paper);
  }

  /* -- verification board -- */
  .board {
    background: var(--board); border-radius: 14px; padding: 26px 22px; margin-top: 4px;
    box-shadow: 0 20px 50px rgba(26,25,34,0.35);
  }
  .board-eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--board-text-soft); margin-bottom: 14px; }
  .banner {
    padding: 18px 20px; border-radius: 10px; margin-bottom: 20px; font-family: 'Archivo', sans-serif; font-weight: 800;
    font-size: 19px; line-height: 1.3; opacity: 0; animation: bannerIn 0.5s ease-out 0.1s forwards;
  }
  .banner.verified { background: linear-gradient(135deg, var(--amber-soft), rgba(240,166,60,0.06)); color: var(--amber); box-shadow: inset 0 0 0 1px rgba(240,166,60,0.4), 0 0 40px var(--amber-glow); }
  .banner.unsatisfiable { background: linear-gradient(135deg, rgba(193,66,58,0.18), rgba(193,66,58,0.06)); color: #ff8f85; box-shadow: inset 0 0 0 1px rgba(193,66,58,0.5), 0 0 40px var(--fail-glow); }
  @keyframes bannerIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .flap-row {
    display: flex; gap: 14px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--board-line);
    opacity: 0; transform: perspective(400px) rotateX(-12deg); transform-origin: top;
    animation: flapIn 0.45s ease-out forwards;
  }
  .flap-row:last-child { border-bottom: none; }
  @keyframes flapIn { to { opacity: 1; transform: perspective(400px) rotateX(0deg); } }
  .flap-status {
    flex-shrink: 0; width: 30px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px;
  }
  .flap-status.pass { background: rgba(47,143,95,0.22); color: #6bd99a; }
  .flap-status.fail { background: rgba(193,66,58,0.22); color: #ff8f85; }
  .flap-body { flex: 1; min-width: 0; }
  .flap-label { color: var(--board-text); font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .flap-compare {
    font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline;
  }
  .flap-compare .val { padding: 1px 7px; border-radius: 4px; }
  .flap-compare .val.actual.pass { background: rgba(47,143,95,0.18); color: #8fe0b4; }
  .flap-compare .val.actual.fail { background: rgba(193,66,58,0.18); color: #ffb0a8; }
  .flap-compare .vs { color: var(--board-text-soft); font-size: 12px; }
  .flap-compare .val.limit { color: var(--board-text-soft); }
  .flap-detail { color: var(--board-text-soft); font-size: 12px; line-height: 1.4; }

  .total-cost {
    margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--board-line);
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Space Mono', monospace; color: var(--board-text);
  }
  .total-cost .amt { font-size: 20px; font-weight: 700; color: var(--amber); }
  .assumptions { font-size: 12px; color: var(--ink-faint); margin-top: 14px; font-style: italic; }

  @media (prefers-reduced-motion: reduce) {
    .banner, .flap-row { animation: none !important; opacity: 1 !important; transform: none !important; }
    .flap-dots span { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Multi-agent travel desk // simulated inventory</div>
    <h1 class="display">Travel Desk</h1>
    <p class="sub">Tell it what you're looking for. It checks that the flight and hotel actually work <em>together</em> before calling anything verified.</p>
  </header>
  <div class="perf"></div>

  <div class="card" id="chat-card">
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="e.g. Family of 4 to Austin, need a pool, budget $2000 total, 3 nights" />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <div id="results-wrap" class="hidden"></div>
</div>

<script>
const chatLog = document.getElementById("chat-log");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
const resultsWrap = document.getElementById("results-wrap");

let conversationId = null;
let searched = false;
let shownTurnCount = 0;
let searchingEl = null;

function isConfirm(text) { return text.startsWith("Got it"); }
function isQuestion(text) { return text.trim().endsWith("?"); }

function renderTurn(t) {
  if (t.role === "user") {
    const row = document.createElement("div");
    row.className = "row-user";
    row.innerHTML = `<div class="bubble-user"></div>`;
    row.querySelector(".bubble-user").textContent = t.text;
    chatLog.appendChild(row);
    return;
  }
  const row = document.createElement("div");
  row.className = "row-agent";
  if (isConfirm(t.text)) {
    row.innerHTML = `<div class="stub-confirm"><div class="stamp">&#10003;</div><div class="stub-text"></div></div>`;
    row.querySelector(".stub-text").textContent = t.text;
  } else if (isQuestion(t.text)) {
    row.innerHTML = `<div class="bubble-question"><div class="tag">?</div><div></div></div>`;
    row.querySelector(".bubble-question > div:last-child").textContent = t.text;
  } else {
    row.innerHTML = `<div class="bubble-question"><div></div></div>`;
    row.querySelector("div > div").textContent = t.text;
  }
  chatLog.appendChild(row);
}

function showSearching() {
  const row = document.createElement("div");
  row.className = "row-searching";
  row.innerHTML = `<div class="searching-pill">
    <div class="flap-dots"><span></span><span></span><span></span></div>
    checking flight + hotel combinations…
  </div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  searchingEl = row;
}

function renderState(data) {
  for (let i = shownTurnCount; i < data.turns.length; i++) renderTurn(data.turns[i]);
  shownTurnCount = data.turns.length;
  chatLog.scrollTop = chatLog.scrollHeight;

  if ((data.status === "ready" || data.status === "best_effort") && !searched) {
    searched = true;
    chatInput.disabled = true;
    chatSend.disabled = true;
    showSearching();
    runSearch();
  }
}

async function runSearch() {
  const res = await fetch(`/api/search/${conversationId}`, { method: "POST" });
  const data = await res.json();
  if (searchingEl) searchingEl.remove();
  renderResults(data);
}

const CHECK_META = {
  "Arrival time vs. check-in window": { icon: "&#8594;", },
  "Total cost vs. budget": { icon: "$" },
  "Required amenities": { icon: "&#10003;" },
  "Party size vs. room capacity": { icon: "&#128101;" },
};

function flapRow(c, index) {
  const cls = c.passed ? 'pass' : 'fail';
  return `<div class="flap-row" style="animation-delay:${0.55 + index * 0.16}s">
    <div class="flap-status ${cls}">${c.passed ? '✓' : '✕'}</div>
    <div class="flap-body">
      <div class="flap-label">${c.label}</div>
      <div class="flap-compare">
        <span class="val actual ${cls}">${c.actual}</span>
        <span class="vs">vs</span>
        <span class="val limit">${c.expected}</span>
      </div>
      <div class="flap-detail">${c.detail}</div>
    </div>
  </div>`;
}

function renderResults(data) {
  resultsWrap.classList.remove("hidden");
  const exp = data.explanation;
  let html = "";

  if (data.hotel || data.flight) {
    html += `<div class="pair-frame"><div class="pair-label">Proposed as one combination -- evaluated together, not separately</div><div class="itinerary">`;
    if (data.hotel) {
      html += `<div class="itin-item lodging">
        <div class="itin-kind lodging">&#127976; Lodging</div>
        <img src="/images/hotels/${data.hotel.id}.jpg" alt="${data.hotel.name}" />
        <h3 class="display">${data.hotel.name}</h3>
        <p>${data.hotel.destination_name}</p>
        <div class="mono-line">$${data.hotel.price_per_night}/night${data.hotel.resort_fee_per_night ? ' + $' + data.hotel.resort_fee_per_night + ' fee' : ''}</div>
        <p>${data.hotel.front_desk_24hr ? '24-hour front desk' : 'Desk closes ' + data.hotel.front_desk_closes}</p>
      </div>`;
    }
    if (data.flight) {
      html += `<div class="itin-item transit">
        <div class="itin-kind transit">&#9992; Transit</div>
        <img src="/images/flights/${data.flight.id}.jpg" alt="${data.flight.flight_number}" />
        <h3 class="display">${data.flight.airline} ${data.flight.flight_number}</h3>
        <p>${data.flight.origin} &#8594; ${data.flight.destination}, ${data.flight.date}</p>
        <div class="mono-line">${data.flight.departure_time} &#8594; ${data.flight.arrival_time}${data.flight.arrives_next_day ? ' (+1d)' : ''}</div>
        <p>$${data.flight.price}/passenger</p>
      </div>`;
    }
    html += `</div>${data.hotel && data.flight ? '<div class="pair-link">&#128279;</div>' : ''}</div>`;
  }

  html += `<div class="board">
    <div class="board-eyebrow">Verification -- per-constraint, not a single judgment call</div>
    <div class="banner ${exp.status}">${exp.headline}</div>`;
  if (exp.checklist.length) {
    html += exp.checklist.map(flapRow).join("");
  }
  if (exp.total_cost) {
    html += `<div class="total-cost"><span>Total trip cost</span><span class="amt">$${exp.total_cost.toFixed(2)}</span></div>`;
  }
  html += `</div>`;

  if (data.constraints.assumptions && data.constraints.assumptions.length) {
    html += `<div class="assumptions">Assumed: ${data.constraints.assumptions.join("; ")}.</div>`;
  }
  resultsWrap.innerHTML = html;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = "";
  chatSend.disabled = true;

  let res, data;
  if (!conversationId) {
    res = await fetch("/api/chat/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    data = await res.json();
    conversationId = data.conversation_id;
  } else {
    res = await fetch("/api/chat/reply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });
    data = await res.json();
  }
  chatSend.disabled = false;
  renderState(data);
}

chatSend.addEventListener("click", sendMessage);
chatInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
