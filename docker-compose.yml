networks:
  ticket-net:
    driver: bridge

services:
  # Local stack: Postgres, backend, frontend, Grafana.
  # LLM inference is Amazon Bedrock (external). Azure Text Analytics,
  # Pinecone, and optional BigQuery stay external APIs (configure via .env).

  postgres:
    mem_limit: 256m
    cpus: 0.50
    image: postgres:16-alpine
    container_name: ticket-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ticket_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ticket_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-tickets_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticket-net
    restart: unless-stopped

  backend:
    mem_limit: 1536m
    cpus: 1.00
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-backend
    env_file:
      - .env
    environment:
      # In-network service names (override host ports from .env).
      - DATABASE_URL=${CLOUD_DATABASE_URL:-postgresql://${POSTGRES_USER:-ticket_admin}:${POSTGRES_PASSWORD:-ticket_local_dev}@postgres:5432/${POSTGRES_DB:-tickets_db}}
      - ENABLE_BIGQUERY=${ENABLE_BIGQUERY:-false}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - AWS_CONFIG_FILE=/root/.aws/config
      - GOOGLE_APPLICATION_CREDENTIALS=/srv/gcp-key.json
      - MAX_WALL_CLOCK_SECONDS=${MAX_WALL_CLOCK_SECONDS:-900}
    ports:
      - "8000:8000"
    volumes:
      # GCP key from GOOGLE_APPLICATION_CREDENTIALS=./gcp-key.json (WORKDIR=/srv).
      - ./gcp-key.json:/srv/gcp-key.json:ro
      # Reuse the host AWS profile without copying keys into .env or the image.
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-net
    restart: unless-stopped

  frontend:
    mem_limit: 256m
    cpus: 0.50
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3001}
    container_name: ticket-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - ticket-net
    restart: unless-stopped

  grafana:
    mem_limit: 384m
    cpus: 0.50
    image: grafana/grafana-oss:11.3.0
    container_name: ticket-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-bigquery-datasource 2.2.1
      - GF_USERS_ALLOW_SIGN_UP=false
      # Anonymous Viewer for iframe embeds (local/demo only; tighten if exposed).
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Optional; consumed by grafana/provisioning/datasources/bigquery.yaml.
      - BIGQUERY_PROJECT_ID=${GCP_PROJECT_ID:-}
      - BIGQUERY_CLIENT_EMAIL=${BIGQUERY_CLIENT_EMAIL:-}
      - BIGQUERY_PRIVATE_KEY=${BIGQUERY_PRIVATE_KEY:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ticket-net
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
