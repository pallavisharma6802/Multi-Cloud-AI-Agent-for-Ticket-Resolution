id: it_saas
display_name: IT / SaaS Customer Support
description: 'Generic SaaS/IT product support taxonomy sourced from the Bitext customer-support intent
  corpus: 27 real, human-authored intents across 10 categories (orders, accounts, billing, refunds, shipping,
  subscriptions, and general contact/feedback).'
source_dataset:
  name: bitext/Bitext-customer-support-llm-chatbot-training-dataset
  url: https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset
  license: cdla-sharing-1.0
  real_data: true
  num_source_rows: 26872
  limitations: Sampled 3400 of 26872 real rows (strided across the full dataset for intent coverage) rather
    than the full corpus, for pipeline build speed. No priority labels exist in the source data -- priority_guidance
    below is advisory prose for the LLM, not a derived label.
intents:
- id: create_account
  category: ACCOUNT
  description: Help signing up or creating a new user account / workspace.
- id: delete_account
  category: ACCOUNT
  description: Permanently close or delete an existing account (privacy / leave the service).
- id: edit_account
  category: ACCOUNT
  description: Change profile details, email, username, or account settings (not password reset).
- id: recover_password
  category: ACCOUNT
  description: Forgot password, reset link, cannot log in because credentials are lost.
- id: registration_problems
  category: ACCOUNT
  description: Signup/registration failed, verification email issues, or blocked registration flow.
- id: switch_account
  category: ACCOUNT
  description: Switch between multiple accounts/workspaces or change the active logged-in account.
- id: check_cancellation_fee
  category: CANCEL
  description: Ask what cancellation fee applies before cancelling a subscription or plan.
- id: contact_customer_service
  category: CONTACT
  description: General request to reach support / customer service (not explicitly demanding a human).
- id: contact_human_agent
  category: CONTACT
  description: Explicitly wants a human agent / live person; bot or FAQ is not enough.
- id: delivery_options
  category: DELIVERY
  description: Ask which shipping/delivery methods are available (standard, express, pickup).
- id: delivery_period
  category: DELIVERY
  description: Ask how long delivery usually takes / ETA windows (not tracking a specific order).
- id: complaint
  category: FEEDBACK
  description: Negative complaint about service quality or experience (not a specific how-to).
- id: review
  category: FEEDBACK
  description: Leaving a product/service review or rating (often positive or mixed feedback).
- id: check_invoice
  category: INVOICE
  description: View or look up an existing invoice/bill (not order shipment status).
- id: get_invoice
  category: INVOICE
  description: Download, resend, or obtain a copy of an invoice/bill PDF.
- id: cancel_order
  category: ORDER
  description: Cancel a purchase/order before or after placement (stop the order).
- id: change_order
  category: ORDER
  description: Modify items/quantity on an existing order (not just shipping address).
- id: place_order
  category: ORDER
  description: Help placing a new order / completing checkout.
- id: track_order
  category: ORDER
  description: Where is my order / shipment status / tracking for a specific order id (not invoices).
- id: check_payment_methods
  category: PAYMENT
  description: Which payment methods are accepted (cards, PayPal, etc.).
- id: payment_issue
  category: PAYMENT
  description: Payment failed, double charge, declined card, or billing/charge problems.
- id: check_refund_policy
  category: REFUND
  description: Ask about refund policy rules/eligibility (not starting a refund yet).
- id: get_refund
  category: REFUND
  description: Request money back / start a refund for a returned or cancelled purchase.
- id: track_refund
  category: REFUND
  description: Status of an existing refund already in progress.
- id: change_shipping_address
  category: SHIPPING
  description: Change the delivery address on an existing order that is packing/shipping.
- id: set_up_shipping_address
  category: SHIPPING
  description: Add or configure a shipping address on the account (not changing an in-flight order).
- id: newsletter_subscription
  category: SUBSCRIPTION
  description: Subscribe/unsubscribe from marketing newsletter emails.
priority_guidance: 'Reason about urgency from the customer''s own words and the entities/sentiment already
  extracted, not from the intent category alone. Signals that typically indicate higher urgency: the customer
  states they cannot access something they are paying for right now (e.g. a blocked account, a failed
  payment blocking service, an active service outage), strongly negative sentiment combined with an explicit
  deadline or threat to cancel, or repeated contact about the same unresolved issue. Signals that typically
  indicate lower urgency: general how-to questions, feedback/suggestions, or requests that have no stated
  time pressure. Category alone (e.g. ''REFUND'') does not determine priority -- a calm, no-deadline refund
  question is not automatically high priority, and a calmly-worded account lockout during a paid trial
  can still be urgent.'
kb_categories:
- ACCOUNT
- CANCEL
- CONTACT
- DELIVERY
- FEEDBACK
- INVOICE
- ORDER
- PAYMENT
- REFUND
- SHIPPING
- SUBSCRIPTION
intent_eval_available: true
