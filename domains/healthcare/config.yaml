id: healthcare
display_name: Healthcare -- Patient Feedback Triage (NHS GP)
description: Patient feedback/complaint triage for GP practices, from NHS GP surgery reviews.
source_dataset:
  name: janduplessis886/england-nhs-gp-reviews
  url: https://huggingface.co/datasets/janduplessis886/england-nhs-gp-reviews
  license: unknown-public-nhs-review-data
  real_data: true
  num_source_rows: 61955
  limitations: No per-row intent labels. Taxonomy is advisory (NHS England GP-complaint categories).
    intent_eval_available is false; star_rating supports priority/severity correlation checks.
intents:
- id: appointment_access
  category: ACCESS
  description: Difficulty getting/booking an appointment, long waits to be seen, or phone/reception access
    problems.
- id: clinical_concern
  category: CLINICAL
  description: Concerns about the quality, safety, or accuracy of clinical care, diagnosis, or test results.
- id: communication_issue
  category: COMMUNICATION
  description: Problems with how information was communicated (unclear explanations, not being kept informed,
    missed callbacks).
- id: staff_conduct
  category: STAFF
  description: Feedback specifically about staff attitude, courtesy, or professionalism (positive or negative).
- id: prescription_medication
  category: PRESCRIBING
  description: Issues with prescriptions, medication reviews, or pharmacy coordination.
- id: administration_records
  category: ADMIN
  description: 'Administrative issues: records, referrals, registration, billing/coding errors, digital
    portal problems.'
- id: general_praise
  category: FEEDBACK
  description: General positive feedback / compliments with no specific actionable issue.
priority_guidance: 'Reason about urgency from the substance of the complaint, not from generic keywords.
  Signals that typically indicate higher priority: a clinical safety concern (a diagnosis or test result
  was mishandled or delayed with health consequences), a pattern of repeated failed attempts to get care
  (not a single missed call), or a vulnerable patient (elderly, seriously ill) being unable to access
  care. Signals that typically indicate lower priority: general praise, single minor administrative inconveniences
  with no safety impact, or feedback about preferences rather than failures. A single rude interaction
  is usually lower priority than a missed clinical follow-up, even though both may be expressed with similar
  emotional intensity -- reason about the underlying risk, not just the sentiment.'
kb_categories:
- FEEDBACK
intent_eval_available: false
